name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/sensei-springboot-backend

jobs:
  code-quality:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Code Quality Tools (PMD, SpotBugs)
        run: mvn -B clean compile pmd:check com.github.spotbugs:spotbugs-maven-plugin:check -Dpmd.failOnViolation=false -Dspotbugs.failOnError=false

  security-scan:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build for CodeQL
        run: mvn -B clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-test:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests & Package
        env:
          JWT_SECRET: dummy_secret_for_ci_tests_only
        run: mvn -B clean verify

