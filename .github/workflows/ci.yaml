name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
      - test
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yaml'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/sensei-springboot-backend

jobs:
  code-quality:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Code Quality Tools (PMD, SpotBugs)
        run: mvn -B clean compile pmd:check com.github.spotbugs:spotbugs-maven-plugin:check -Dpmd.failOnViolation=false -Dspotbugs.failOnError=false

      - name: Enforce No-Emoji Policy in Source Code
        run: |
          echo "Scanning for emojis in src/ directory..."
          if LC_ALL=C grep -rP "[\x{1F300}-\x{1F64F}\x{1F680}-\x{1F6FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}\x{1F900}-\x{1F9FF}\x{1FA70}-\x{1FAFF}]" src/; then
            echo "::error::Emojis detected in source code! Please remove them to comply with enterprise code quality standards."
            exit 1
          else
            echo "Success: No emojis found in source code."
          fi

  security-scan:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build for CodeQL
        run: mvn -B clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  build-and-test:
    if: github.repository == 'SAARKSensei/Backend_Aws'
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sensei_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests & Package
        env:
          LOCAL_DB_URL: jdbc:mysql://127.0.0.1:3306/sensei_db
          LOCAL_DB_USERNAME: root
          LOCAL_DB_PASSWORD: root
        run: mvn -B clean verify
