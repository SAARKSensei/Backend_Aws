name: Production Release & Deploy

# Only trigger when a new GitHub Release is published.
# This will NOT run on normal commits to the main branch.
on:
  release:
    types: [published]

jobs:
  # ==========================================
  # JOB 1: CI (Testing)
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        # If any test fails, this step fails, and the entire deployment is aborted!
        run: mvn clean test

  # ==========================================
  # JOB 2: Build & Push to Docker Hub
  # ==========================================
  build_and_push:
    name: Build & Push Image
    needs: test # CRITICAL: This ensures we only build if the tests above passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # We tag the image with BOTH the release version (e.g. v1.0.5) and 'latest'
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sensei-backend:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKER_USERNAME }}/sensei-backend:latest

  # ==========================================
  # JOB 3: Deploy to EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: build_and_push # Only deploy if the image was successfully pushed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/Backend_Aws"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,DOCKER_PASS
          script: |
            # 1. Navigate to where your docker-compose.yml is stored on the server
            cd /home/${{ secrets.EC2_USERNAME }}/Backend_Aws
            
            # 2. Inject the environment variables from GitHub Secrets into a .env file
            echo "${{ secrets.PRODUCTION_ENV }}" > .env
            
            # 3. Log in to Docker Hub so we can pull private images
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            
            # 4. Pull the newly pushed image
            docker pull ${{ secrets.DOCKER_USERNAME }}/sensei-backend:latest
            
            # 5. Let Docker Compose swap the old container for the new one (using docker compose plugin)
            docker compose up -d
