name: Update Release Notes

# Trigger this workflow automatically whenever you manually publish a release on GitHub
on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual dry-run testing from GitHub Actions tab

jobs:
  update_release:
    name: Auto-Generate Notes from Commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update the GitHub release
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all commit history for the changelog

      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "HYBRID" # Processes both Pull Requests and direct commits
          configurationJson: |
            {
              "template": "## 🚀 Release Notes (${{ github.event.release.tag_name }})\n\n#{{CHANGELOG}}\n\n### 📦 Other Changes\n#{{UNCATEGORIZED}}\n\n### 👥 Contributors\n#{{CONTRIBUTORS}}",
              "pr_template": "- #{{TITLE}} in ##{{NUMBER}} by @#{{AUTHOR}}",
              "commit_template": "- #{{TITLE}} (https://github.com/${{ github.repository }}/commit/#{{MERGE_SHA}}) by @#{{AUTHOR}}",
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|chore|docs|style|refactor|perf|test|ci|build)(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "target": "$1",
                  "on_property": "title"
                }
              ],
              "categories": [
                {
                  "title": "### ✨ Key Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "### 🐛 Bug Fixes & Deployment Hotfixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "### 🏗 Architecture & Refactoring",
                  "labels": ["refactor", "perf"]
                },
                {
                  "title": "### 📚 DevOps & Documentation",
                  "labels": ["docs", "chore", "ci", "build", "test", "style"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Print Changelog (Dry Run)
        if: github.event_name == 'workflow_dispatch'
        run: echo "${{ steps.build_changelog.outputs.changelog }}"

      - name: Update GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: ${{steps.build_changelog.outputs.changelog}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
