server.port=9090

# Auto-load the .env file so we don't need export commands anymore
spring.config.import=optional:file:.env[.properties]

# Default to local development profile, can be overridden by environment variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging configuration
logging.level.com.sensei.backend=${LOG_LEVEL:INFO}

# Spring Security OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:9090/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

################################# PAYMENT Credentials ############################################

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.environment=live

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Fixed Spring Security credentials (DEV ONLY)
