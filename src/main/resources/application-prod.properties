################################ Prod DataBase Properties ###########################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Run schema.sql on startup to create missing tables, but ignore constraint errors
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql

# Production CORS configuration (Temporary localhost allowed)
cors.allowed-origins=https://sensei.org.in,https://www.sensei.org.in,https://sensei-website-preview.vercel.app,http://localhost:3000,http://localhost:5173
